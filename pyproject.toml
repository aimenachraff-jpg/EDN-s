[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edns"
version = "1.0.1"
description = "EDN-S: Enhanced Deep Network for Satellite Super-Resolution — Lightweight EDSR-small implementation for Sentinel-2/ALSAT-2B imagery with built-in hallucination detection (spectral, structural, textural, semantic). Pip-installable CLI and Python API. Research project for Master 2 CS/AI (Algeria) with ASAL (Algerian Space Agency) relevance."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Chekalil Aimene Charef Eddine", email = "aimenachraff@example.com"}
]
maintainers = [
    {name = "Chekalil Aimene Charef Eddine", email = "aimenachraff@example.com"}
]
keywords = [
    "super-resolution",
    "satellite",
    "sentinel-2",
    "alsat-2b",
    "edsr",
    "deep-learning",
    "remote-sensing",
    "pytorch",
    "hallucination-detection",
    "image-processing",
    "gis",
    "asal",
    "algerian-space-agency"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Visualization",
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "omegaconf>=2.3.0",
    "scipy>=1.10.0",
    "scikit-image>=0.21.0",
    "rasterio>=1.3.0",
    "pillow>=9.0.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
    "pre-commit>=3.0",
]
gui = [
    "tkinter",
]
cloud = [
    "kagglehub>=0.3.0",
    "kaggle>=1.7.0",
]
full = [
    "edns[dev,gui,cloud]",
]

[project.urls]
Homepage = "https://github.com/aimenachraff-jpg/EDN-s"
Repository = "https://github.com/aimenachraff-jpg/EDN-s"
Issues = "https://github.com/aimenachraff-jpg/EDN-s/issues"
Documentation = "https://github.com/aimenachraff-jpg/EDN-s/wiki"
Changelog = "https://github.com/aimenachraff-jpg/EDN-s/releases"
Funding = "https://github.com/sponsors/aimenachraff-jpg"

[project.scripts]
edns-sr = "edns.inference.app:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["edns*"]

[tool.setuptools.package-data]
edns = [
    "configs/**/*.yaml",
    "configs/**/*.yml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false