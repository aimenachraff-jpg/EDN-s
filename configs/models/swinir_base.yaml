# SwinIR-base Configuration
# Protocol: 6 layers, 180 embed_dim, 6 heads, scale=4, 4 channels

model:
  _target_: src.models.swinir.SwinIR
  upscale: 4
  img_size: 64
  window_size: 8
  depths: [6, 6, 6, 6, 6, 6]
  embed_dim: 180
  num_heads: [6, 6, 6, 6, 6, 6]
  mlp_ratio: 2
  in_chans: 4
  out_chans: 4

training:
  batch_size: 16
  patch_size: 64
  lr: 2.0e-4
  epochs: 200
  loss_type: "l1+lpips"
  lpips_weight: 0.1
  amp: true
  num_workers: 4
  seed: 123
  deterministic: true
  val_interval: 1
  checkpoint_interval: 50
  grad_clip: 1.0

# Pretrained weights (optional)
# pretrained_path: "experiments/checkpoints/swinir_base_x4.pth"
# pretrained_3ch: true  # adapt from 3-channel pretrained

# Tiny variant for CPU development
tiny:
  depths: [2, 2, 2, 2, 2, 2]
  embed_dim: 60
  num_heads: [2, 2, 2, 2, 2, 2]